name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are pointless; a release run must finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test the release versioning script
        if: matrix.os == 'ubuntu-latest'
        run: .github/scripts/next-version_test.sh

  release:
    name: Release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history, so the last tag can be found

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Decide the next version
        id: version
        run: |
          set -euo pipefail
          last_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$last_tag" ]; then
            range="$last_tag..HEAD"
          else
            range="HEAD"
          fi

          next="$(git log --format='-----COMMIT-----%n%s%n%b' $range | .github/scripts/next-version.sh "$last_tag")"

          echo "last=$last_tag" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "Last tag: ${last_tag:-none} → next: $next"

      - name: Build the release binaries
        if: steps.version.outputs.next != 'none'
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          mkdir -p dist

          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            out="dist/portadmin_${VERSION}_${os}_${arch}"

            mkdir -p "$out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$out/portadmin" .
            cp README.md LICENSE "$out/"
            tar -czf "$out.tar.gz" -C dist "$(basename "$out")"
            rm -rf "$out"
          done

          cd dist && sha256sum *.tar.gz > checksums.txt
          ls -la

      - name: Write the release notes
        if: steps.version.outputs.next != 'none'
        env:
          RANGE: ${{ steps.version.outputs.range }}
          LAST: ${{ steps.version.outputs.last }}
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          {
            echo "## Changes"
            echo
            git log --no-merges --format='- %s' $RANGE \
              | grep -vE '^- (docs|chore|ci|test|style|build)(\(.*\))?:' \
              || echo "- Maintenance"
            echo
            echo "## Install"
            echo
            echo '```sh'
            echo "go install github.com/${GITHUB_REPOSITORY}@${VERSION}"
            echo '```'
            echo
            echo "Or download a binary below. On macOS, clear the quarantine flag after unpacking:"
            echo '`xattr -d com.apple.quarantine portadmin`'
            if [ -n "$LAST" ]; then
              echo
              echo "**Full diff**: https://github.com/${GITHUB_REPOSITORY}/compare/${LAST}...${VERSION}"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Publish the release
        if: steps.version.outputs.next != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file release-notes.md \
            dist/*.tar.gz dist/checksums.txt

      - name: Report a skipped release
        if: steps.version.outputs.next == 'none'
        run: |
          echo "No release. The commits since ${{ steps.version.outputs.last }} are housekeeping only."
